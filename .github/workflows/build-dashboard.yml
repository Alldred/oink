name: Build and publish dashboard

on:
  # Scheduled runs are triggered by the Cloudflare Worker in cloudflare-scheduler/
  # (GitHub Actions cron is best-effort and often skips windows under load).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Run 42670130375 still holds the old group name `pages` and GitHub will not cancel it.
  group: pages-publish
  # A newer dashboard replaces an older in-flight build.
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore weather cache
        uses: actions/cache@v4
        with:
          path: public/.weather-cache.json
          key: weather-cache-${{ github.run_id }}
          restore-keys: |
            weather-cache-

      - name: Generate dashboard
        env:
          TZ: Europe/London
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python src/generate_dashboard.py --timezone Europe/London; then
              exit 0
            fi
            echo "Generate attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish dashboard.png to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f public/dashboard.png
          test -f public/.nojekyll

          publish="$(mktemp -d)"
          cp public/dashboard.png public/.nojekyll "$publish/"
          git -C "$publish" init -b gh-pages
          git -C "$publish" config user.name "github-actions[bot]"
          git -C "$publish" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish" add dashboard.png .nojekyll
          git -C "$publish" commit -m "Publish dashboard"

          # Each publish is a new root commit, so updating the branch replaces
          # history. This remote is only gh-pages, never main.
          askpass="$(mktemp)"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *) echo "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod +x "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C "$publish" push --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
