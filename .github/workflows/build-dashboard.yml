name: Build and publish dashboard

on:
  # Scheduled runs are triggered by the Cloudflare Worker in cloudflare-scheduler/
  # (GitHub Actions cron is best-effort and often skips windows under load).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an in-flight deploy finish; overlapping crons queue instead of cancelling.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore weather cache
        uses: actions/cache@v4
        with:
          path: public/.weather-cache.json
          key: weather-cache-${{ github.run_id }}
          restore-keys: |
            weather-cache-

      - name: Generate dashboard
        env:
          TZ: Europe/London
        run: |
          set -e
          for attempt in 1 2 3; do
            if python src/generate_dashboard.py --timezone Europe/London; then
              exit 0
            fi
            echo "Generate attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Stage Pages files
        run: |
          mkdir -p _site
          cp public/dashboard.png public/.nojekyll _site/
          # Keep fixture PNGs in the repo for local --test, but do not publish them.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
